# B안 상판 팔레트 v3 칸 12곳 (시뮬레이션 모델 B안 build/stl/pallet_vals.json = puck_pallet.scad 값을 옮김).
# 좌표: base_link 기준 [m] (x 앞, y 왼쪽, z 위). 팔레트 원점 = 팀 조인트1 축 (0.096, 0, 0.111) = 상판 윗면.
#   x, y      = 칸 가운데 (퍽 축)
#   theta_deg = 칸 방향각 (조인트1 에서 칸을 보는 방향, base_link +x = 0°, 반시계 +)
#   floor_z   = 칸 바닥 (퍽 밑면이 앉는 높이), wall_top_z = 칸 벽 윗면
#   puck      = pucks:=true 일 때 그 칸에 놓이는 퍽 링크 이름 (원기둥 12 g · 사각 18 g, (열 + 칸) 짝수 = 원기둥)
# 설계 쪽 B안_팔레트/pallet_slots.yaml 의 joints_deg · grasp_z 는 OM-X 팔 기준이라 넣지 않음 (팀 RM-X52 팔로 다시 구할 것).
