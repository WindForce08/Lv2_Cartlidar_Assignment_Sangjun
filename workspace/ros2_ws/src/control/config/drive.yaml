drive_node:
  ros__parameters:
    nav2_action: navigate_to_pose
    spin_action: spin
    stale_s: 0.3                   # result · /tfmini/range · /scan · odom 300 ms 규칙
    navigate:
      xy_goal_tolerance: 0.025     # 이 안의 목표는 nav2 spin 으로. nav2 goal checker xy_goal_tolerance 와 같게 (인지 Nav2 설정 0.025, 이슈 #31)
      spin_time_allowance: 15.0
    base:
      front_offset: 0.1328         # base_link → 차체 앞 끝 x ★ B안 상판 앞 끝 (make_maze_scene BODY_X, TFmini 렌즈 x 0.130, 계획기 poses.FRONT). 실측값이 있으면 그 값 (#31)
    align:
      rate_hz: 20.0
      kp_yaw: 1.2                  # 정밀: rad/s per 정규화 가로 오차
      kp_lin: 1.0
      max_angular: 0.6
      max_linear: 0.08
      lateral_tolerance: 0.04
      settle_cycles: 10
      coarse_kp_yaw: 1.5           # 먼 거리
      coarse_kp_lin: 0.8
      coarse_max_speed: 0.15
      coarse_max_angular: 0.8
      coarse_yaw_tolerance: 0.05
      coarse_min: 0.30             # 먼 거리 모드에서 이보다 작은 목표는 거부
      mode_wait_s: 0.5             # goal 뒤 첫 새 result 를 기다리는 시간 (모드 결정)
      lost_timeout_s: 0.5
      timeout_s: 30.0
      min_target_distance: 0.13    # 정밀 목표 = TFmini 렌즈 → 박스 앞면 [m]. 최소 측정 0.10 + box.stop_margin
      default_tolerance: 0.01      # ★ TFmini 실측 보정 뒤 반복 정밀도에 맞출 것 (사양 ±5 cm, 보정 없이는 1 cm 를 못 맞춤)
      box:                         # 정밀 전후 거리 = /tfmini/range (1층 TFmini → 퍽이 놓인 박스 앞면, 205 × 205 × 70 mm)
        window: 5                  # 최근 측정 수 (TFmini 50 Hz → 0.1 s)
        min_samples: 3             # 이 수 이상 유효해야 씀
        spread_m: 0.03             # 창 안 최대 − 최소가 이보다 크면 무효 (빔이 박스 모서리에 걸림)
        stop_margin: 0.03          # 정밀 동안 obstacle_stop 정지 거리 = 목표 − 이 값 (TFmini 최소 0.10 이상)
        stop_min: 0.10
        obstacle_stop_node: /obstacle_stop
    scan:
      required: true               # 먼 거리 접근은 /scan 없으면 중지
      half_angle: 0.349            # ±20°
      front_margin: 0.10           # 물체보다 0.1 m 이상 가까운 점 → 정지
      rear_stop: 0.30
      rear_camera: true            # 후진 때 /perception/rear_obstacle (뒤 D435) 도 확인, 값 없음 = 막힘 (#84). bringup use_perception:=false 면 끔
    skill:
      enabled: false               # robot_policy(ONNX Runtime) 연결 전까지 false → goal 거절 → mission fallback
      policies_file: ""            # 예: /home/jetson/robot_ws/install/robot_policy/share/robot_policy/config/policies.yaml
      max_linear: 0.3
      max_angular: 1.5
      scan_bins: 360
      front_margin: 0.10             # 정책 주행: 범퍼 앞면(base.front_offset) + 이 거리 안에 점 (±scan.half_angle) → 전진 0, 회전 허용 ★
    turn:                          # 상자 퍽 45° 집기 제자리 회전 turn_p<deg> · turn_m<deg> · turn_0 (#77). skill.enabled 와 상관없이 받음
      kp: 2.0                      # (rad/s) / rad, 되먹임 = /odometry/filtered yaw, 기준 = 직전 FINE 정렬 성공 때 yaw
      max_angular: 0.6
      min_angular: 0.15            # ★ 실물에서 제자리 회전이 시작되는 최소 속도로
      tolerance_deg: 1.0           # 끝 yaw 허용 (이슈 ±1.5°)
      settle_cycles: 6             # 20 Hz × 6 = 0.3 s
      max_deg: 30.0                # 이보다 큰 회전 이름은 거부
      j1_x: 0.096                  # base_link → J1 축 x (mission_planner poses.J1_X)
      center_x: -0.04035           # 계획기가 가정한 회전 중심 = 외곽 가운데 (poses.CENTER_X)
      # 실제 제자리 회전 중심 x 는 robot_geometry.yaml base.icr_x (EKF odom_icr 와 같은 값, #92). J1 옆 이동이 같게 각을 바꿈: 17.06° → 14.3°
