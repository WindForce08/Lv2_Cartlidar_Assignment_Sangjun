# 컨트롤러 (Firmware 팀) — 4바퀴 (waffle_4wd)
controller_manager:
  ros__parameters:
    update_rate: 100

diff_drive_controller:
  ros__parameters:
    type: diff_drive_controller/DiffDriveController
    left_wheel_names: ["wheel_left_front_joint", "wheel_left_rear_joint"]
    right_wheel_names: ["wheel_right_front_joint", "wheel_right_rear_joint"]
    # wheel_separation · linear.x 한계는 구동 방식별 drive_<direct|belt>.yaml (base_bringup 의 drive 인자가 고름)
    wheel_separation_multiplier: 1.0
    wheel_radius: 0.033
    odom_frame_id: odom
    base_frame_id: base_link
    enable_odom_tf: false            # odom→base_link TF 는 ekf 만 발행
    cmd_vel_timeout: 0.5
    linear.x.max_acceleration: 1.5
    linear.x.max_deceleration: -1.5   # diff_drive 6.x 이름 (예전 min_acceleration 은 인자가 없어 무시됨). 음수
    angular.z.max_velocity: 2.0
    angular.z.min_velocity: -2.0

arm_controller:
  ros__parameters:
    type: joint_trajectory_controller/JointTrajectoryController
    joints: [joint1, joint2, joint3, joint4, joint5, gripper_roll]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    constraints:
      goal_time: 1.0
      stopped_velocity_tolerance: 0.05

joint_state_broadcaster:
  ros__parameters:
    type: joint_state_broadcaster/JointStateBroadcaster

imu_sensor_broadcaster:
  ros__parameters:
    type: imu_sensor_broadcaster/IMUSensorBroadcaster
    sensor_name: imu
    frame_id: imu_link

# 그리퍼 개폐 액추에이터가 정해지면 use_gripper:=true 와 함께 사용 ★
gripper_controller:
  ros__parameters:
    type: parallel_gripper_action_controller/GripperActionController
    joint: gripper_joint
