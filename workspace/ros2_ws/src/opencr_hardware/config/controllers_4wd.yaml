# 컨트롤러 (Firmware 팀) — 주행 4륜 · 팔. 관절 이름 = CAD URDF (cartridar_01.urdf) · urdf/opencr.ros2_control.xacro
controller_manager:
  ros__parameters:
    update_rate: 100

diff_drive_controller:
  ros__parameters:
    type: diff_drive_controller/DiffDriveController
    left_wheel_names: ["wheel_fl_joint", "wheel_rl_joint"]
    right_wheel_names: ["wheel_fr_joint", "wheel_rr_joint"]
    wheel_separation: 0.2744         # 바퀴 중심 사이 = CAD 바퀴 y ±0.1372 ★ 실측. 4WD 미끄럼 보정은 wheel_separation_multiplier 로
    wheel_separation_multiplier: 1.0
    wheel_radius: 0.033
    odom_frame_id: odom
    base_frame_id: base_link
    enable_odom_tf: false            # odom→base_link TF 는 ekf 만 발행
    publish_rate: 50.0
    cmd_vel_timeout: 0.5
    linear.x.max_velocity: 0.34
    linear.x.min_velocity: -0.34
    linear.x.max_acceleration: 1.5
    linear.x.min_acceleration: -1.5
    angular.z.max_velocity: 2.0
    angular.z.min_velocity: -2.0

arm_controller:
  ros__parameters:
    type: joint_trajectory_controller/JointTrajectoryController
    joints: [joint1, joint2, joint3, joint4, wrist_roll_joint]   # gripper_motor_joint (6 번째 칸) 은 gripper_controller 가 맡음
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    constraints:
      goal_time: 1.0
      stopped_velocity_tolerance: 0.05

joint_state_broadcaster:
  ros__parameters:
    type: joint_state_broadcaster/JointStateBroadcaster

imu_sensor_broadcaster:
  ros__parameters:
    type: imu_sensor_broadcaster/IMUSensorBroadcaster
    sensor_name: imu
    frame_id: imu_link

# 그리퍼 = 팔 6 번째 칸 (ID 15). 목표 단위는 모터 각 rad (범위 -0.83 ~ 1.27, opencr.ros2_control.xacro) — 손가락 간격 m 아님 ★
gripper_controller:
  ros__parameters:
    type: parallel_gripper_action_controller/GripperActionController
    joint: gripper_motor_joint
