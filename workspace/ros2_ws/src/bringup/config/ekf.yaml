ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    two_d_mode: true
    publish_tf: true             # odom → base_link 은 ekf 만 발행 (diff_drive enable_odom_tf: false)
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    odom0: /odom
    odom0_config: [false, false, false,  false, false, false,
                   true,  false, false,  false, false, false,
                   false, false, false]   # vx 만 — 스키드 회전 때 바퀴가 미끄러져 회전 속도는 부정확
    imu0: /imu/data
    imu0_config: [false, false, false,  false, false, false,
                  false, false, false,  false, false, true,
                  false, false, false]    # 회전 속도는 IMU 에서만
    imu0_remove_gravitational_acceleration: true
