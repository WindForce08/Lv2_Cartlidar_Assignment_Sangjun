# B0 퍽 등록부(perception_survey) 설정. perception.launch.py 가 use_survey:=true(기본)일 때 띄운다. ★ = 실물에서 다시 확인할 값
#   노드는 켜져도 /perception/survey/start 를 받기 전에는 관측을 넣지 않는다(enabled false 로 1 s 마다 발행)
#   완료 파일 경로(output_path)는 launch 인자 survey_output 으로 준다
puck_survey:
  ros__parameters:
    world_frame: map            # 지도 좌표가 발제 원점에 정렬돼 있어야 함. 모의 odom 시험은 launch 사본 설정으로 바꿈
    merge_gate_m: 0.035         # 슬롯 결합 문턱 (퍽 중심 ±40 mm 배치, 0~40 mm)
    min_observations: 2
    max_age_s: 0.5              # [s] 이보다 오래된 /perception/pucks 는 넣지 않음
    tagged_min_confidence: 0.4  # ★ 태그 퍽(팔 카메라)의 색 · 모양 점수 문턱. 점수 = 정사각 색띠 점유율이라 올바른 원기둥도
                                #   0.425~0.578(모의 통합 42관측) → 0.6 이면 원기둥 칸이 완료되지 않음. 0.4 는 모의 통합(12/12)에서 쓴 값이며 실물 최적값 아님.
                                #   D435 관측은 노드 안 고정 0.6 그대로
