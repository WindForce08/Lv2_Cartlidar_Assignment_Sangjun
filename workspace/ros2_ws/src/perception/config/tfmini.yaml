# TFmini Plus (1층 정면 바닥, 앞쪽 거리). 실물에서만 실행한다 ★ = 실물에서 다시 확인할 값
tfmini_node:
  ros__parameters:
    port: /dev/tfmini           # udev/99-sensors.rules 로 고정한 이름 ★
    baud: 115200
    range_topic: /tfmini/range
    frame_id: tfmini_link       # URDF 에는 없다 (사용자 결정: 세 번째 거리 센서는 URDF 에 넣지 않음)
    min_strength: 100           # 신호세기가 이보다 약하면 무효 ★
    min_range: 0.1              # [m] 측정 가능 범위 ★ 제조사 사양 확인
    max_range: 12.0
    field_of_view: 0.063        # [rad] 3.6° ★
    stale_timeout_s: 0.2
    publish_rate: 50.0
