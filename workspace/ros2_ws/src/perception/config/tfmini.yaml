# TFmini Plus (1층 정면 바닥): 퍽이 놓인 박스(205 × 205 × 70 mm) 앞면까지 거리 → drive FINE 정렬 · obstacle_stop.
# 팔 거리(/arm_range)가 아니다. 실물에서만 실행한다 (bringup use_tfmini). ★ = 실물에서 다시 확인할 값
tfmini_node:
  ros__parameters:
    port: /dev/tfmini           # udev/99-sensors.rules 로 고정한 이름 ★
    baud: 115200
    range_topic: /tfmini/range
    frame_id: tfmini_link       # URDF(opencr_hardware robot.urdf.xacro · waffle_4wd_description) base_link 아래 렌즈면 (0.130, 0, 0.0243) ★ 실측
    min_strength: 100           # 신호세기가 이보다 약하면 무효 ★
    min_range: 0.1              # [m] 측정 가능 범위 ★ 제조사 사양 확인
    max_range: 12.0
    field_of_view: 0.063        # [rad] 3.6° ★
    stale_timeout_s: 0.2
    publish_rate: 50.0
    output_mm: true             # 켤 때 출력 형식을 mm 로 바꿈 (기본 cm 는 1 cm 단위). 저장하지 않으므로 매번 보냄
    offset_m: 0.0               # ★ 실측 보정: 측정값에 더할 값 [m] (보정점이 없을 때)
    # ★ 실측 보정표: 실제 박스 재질 앞 0.10 ~ 0.40 m 를 줄자로 재어 측정값(raw) · 실제(true) 를 오름차순으로 넣는다.
    #   사양 정확도는 ±5 cm (0.1~5 m) 라 보정 없이는 박스 정밀 정지에 쓰기 어렵다. 빈 목록은 yaml 형식 문제로 적지 않음
    # calib_raw_m:  [0.10, 0.15, 0.20, 0.30, 0.40]
    # calib_true_m: [0.10, 0.15, 0.20, 0.30, 0.40]
